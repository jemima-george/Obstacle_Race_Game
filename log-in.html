<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Log-in</title>
	<link rel="icon" type="image/x-icon" href="..\Images\cheese.png">
	<link rel="stylesheet" href="../CSS file/mystyle.css">
	<script src="..\Java Script\leaderboard.js" defer></script>
	<script src="..\Java Script\log-in func.js" defer></script>

</head>


<body>

	<!-- Navigation bar  -->
	<div class="topnav">
		<a href=".\Index.html">Mouse Obstacle Race game</a>
		<a href=".\Instructions to play.html">Instructions to play</a>
		<a href=".\Leaderboard.html">Leaderboard</a>
		<a class="active" href=".\Log-in.html" id="logged-in">Log-in</a>
		<a href=".\Register.html">Register</a>
	</div>

	<h1 title="This is the Log-in page" ; id="logtitle" ;>Log-in</h1>
	<welcomePara id="loginPara"></welcomePara>

	<!-- Log-in form -->
	<form id="logform" onsubmit="return checkPassword();">

		<div class="container">
			<label for="Email"><b>Email</b></label><br><br>
			<input type="email" ; id="lemail" ; size="20" ;minlength="3" ; maxlength="320" ; placeholder="Enter Email" ;
				name="Email" required><br><br><br>

			<label for="psw"><b>Password</b></label> <br><br>
			<input type="password" ; id="lpass" ; size="20"; minlength="6" ; maxlength="32" ;
				placeholder="Enter Password" name="psw" required><br><br><br>

			<button type="submit" , id="lsubmit" onclick="login(event)">Login</button><br><br>
			<label>
				<input type="checkbox" checked="checked" name="remember"> Remember me
			</label>
		</div>

		<div class="lcontainer" ;style="background-color:#f1f1f1">
			<!-- <span> element which is used to color a part of a text
				required means that input needs to be filled before submitting; -->
			<span class="lpsw">Forgot <a href=".\Register.html">password?</a></span><br>
		</div>
	</form>

	<p id="loginfailure" style="color:red;"></p>

	<script>
		window.onload = function() {
			// Check if the user is logged in
			if (sessionStorage.loggedinUsrName) {
				let loggedIn = document.getElementById("logged-in");
				loggedIn.innerHTML = "Player " + sessionStorage.loggedinUsrName;
			}
		};
	</script>

</body>

</html>
